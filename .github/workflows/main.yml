
name: Build VectorCraft APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VectorCraft
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
    
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
     
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Extract ArtCraft Builder
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*vectorcraft-font-permission-fix.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Builder ZIP not found!"
            exit 1
          fi

          mkdir -p builder
          unzip -q "$ZIP_FILE" -d builder

          BUILD_SCRIPT=$(find "$GITHUB_WORKSPACE/builder" -type f -name build.sh | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "build.sh not found!"
            exit 1
          fi

          BUILDER_DIR=$(dirname "$BUILD_SCRIPT")
          echo "BUILDER_DIR=$BUILDER_DIR" >> $GITHUB_ENV

      - name: Build VectorCraft APK
        run: |
          cd "$BUILDER_DIR"
          chmod +x generate-catalog.sh
          bash build.sh -vectorcraft

      - name: Upload VectorCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: VectorCraft-Android-APK
          path: builder/**/output/*.apk
          if-no-files-found: error
          retention-days: 30
