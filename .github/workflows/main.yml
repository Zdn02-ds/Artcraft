
name: Inspect ArtCraft Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ArtCraft source
        run: |
          mkdir extracted
          unzip -q artcraft-android-0.6.0-vectorcraft-font-permission-fix.zip -d extracted

      - name: Inspect project structure
        run: |
          echo "=== PROJECT FILES ==="
          find extracted -maxdepth 3 -type f | head -150

      - name: Read Android build workflow
        run: |
          echo "=== ANDROID BUILD WORKFLOW ==="
          find extracted -path "*/.github/workflows/build-android-launcher.yml" -exec cat {} \;

      - name: Read project instructions
        run: |
          echo "=== README ==="
          find extracted -maxdepth 2 -name README.md -exec sh -c 'echo "--- $1 ---"; sed -n "1,180p" "$1"' _ {} \;
